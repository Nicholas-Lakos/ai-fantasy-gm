name: Normalize backend
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair main.py newline corruption
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/main.py')
          s = p.read_text(encoding='utf-8')
          marker = '# LIVE_SHOW_OVR_SYSTEM_V1'
          app_line = "app=FastAPI(title='AI Fantasy GM',version='11.2');app.add_middleware(CORSMiddleware,allow_origins=['*'],allow_methods=['*'],allow_headers=['*'])"
          if marker in s and app_line in s:
              mi = s.index(marker)
              ai = s.index(app_line, mi)
              prefix = s[:mi]
              block = s[mi:ai].replace('\\n', '\n')
              rest = s[ai + len(app_line):]
              if rest.startswith('\\n'):
                  rest = '\n' + rest[2:]
              new = prefix + app_line + '\n' + block + rest
              if new != s:
                  p.write_text(new, encoding='utf-8')
          PY
      - name: Validate backend
        run: python -m py_compile backend/main.py backend/run.py backend/show_server.py backend/show_live.py
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py
          git commit -m 'Fix main.py newline corruption'
          git push
