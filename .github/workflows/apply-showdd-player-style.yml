name: Validate and deploy-ready ShowDD update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed Live OVR backend
        run: python backend/normalize_live_ovr.py

      - name: Inspect repaired source boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('backend/main.py').read_text(encoding='utf-8')
          i = s.find('app=FastAPI')
          print(repr(s[max(0, i-80):i+180]))
          print('literal_backslash_n_count=', s.count('\\n'))
          PY

      - name: Validate backend syntax
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/show_server.py
          python -m py_compile backend/show_live.py

      - name: Validate frontend syntax
        run: node --check frontend/fixes.js

      - name: Commit validated repair
        run: |
          git config user.name 'AI Fantasy GM Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/main.py frontend/fixes.js .github/workflows/apply-showdd-player-style.yml backend/normalize_live_ovr.py
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Repair Live OVR backend and validate deployment'
          git push origin HEAD:main
