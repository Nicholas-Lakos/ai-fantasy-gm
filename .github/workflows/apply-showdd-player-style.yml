name: Validate and deploy-ready ShowDD update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed Live OVR block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/main.py')
          s = p.read_text(encoding='utf-8')
          marker = '# LIVE_SHOW_OVR_SYSTEM_V1'
          app_marker = 'app=FastAPI('
          start = s.find(marker)
          app_pos = s.find(app_marker)
          if start == -1:
              print('No Live OVR block found; nothing to repair')
          elif app_pos == -1:
              raise SystemExit('FastAPI app initialization is missing')
          else:
              end = s.find(app_marker, start)
              if end == -1:
                  raise SystemExit('Could not locate FastAPI initialization after Live OVR block')
              block = s[start:end]
              # Previous automated patches accidentally wrote the two characters backslash+n.
              # Convert those only inside the generated Live OVR block, not the rest of main.py.
              block = block.replace('\\\\n', '\n')
              # Put the FastAPI initialization before every route decorator in this block.
              app_line_end = s.find('\n', app_pos)
              app_line = s[app_pos:app_line_end]
              prefix = s[:start]
              suffix = s[app_pos:]
              # Remove the old block and place it immediately after app initialization.
              new_suffix = app_line + '\n' + block + suffix[len(app_line):]
              p.write_text(prefix + new_suffix, encoding='utf-8')
              print('Normalized Live OVR block and moved it after FastAPI initialization')
          PY

      - name: Validate backend syntax
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/show_server.py
          python -m py_compile backend/show_live.py

      - name: Validate frontend syntax
        run: node --check frontend/fixes.js

      - name: Commit validated repair
        run: |
          git config user.name 'AI Fantasy GM Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/main.py frontend/fixes.js .github/workflows/apply-showdd-player-style.yml
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Repair Live OVR backend and validate deployment'
          git push origin HEAD:main
