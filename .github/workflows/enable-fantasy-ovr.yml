name: Enable Fantasy OVR frontend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Fantasy OVR is loaded by fixes.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/fixes.js')
          s=p.read_text(encoding='utf-8')
          marker='FANTASY_OVR_LOADER_V2'
          if marker not in s:
              s += "\n/* FANTASY_OVR_LOADER_V2 */\n(()=>{const load=()=>{if(document.querySelector('script[data-fantasy-ovr]'))return;const s=document.createElement('script');s.src='/fantasy_ovr.js?v=20260903';s.async=false;s.dataset.fantasyOvr='1';document.head.appendChild(s)};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load()})();\n"
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/fixes.js
          git diff --cached --quiet || git commit -m 'Load Fantasy OVR from existing frontend script'
          git push
