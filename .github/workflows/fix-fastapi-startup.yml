name: Fix FastAPI startup order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move FastAPI app initialization before routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/main.py')
          s = p.read_text(encoding='utf-8')
          marker = '# LIVE_SHOW_OVR_SYSTEM_V1'
          app_line = "app=FastAPI(title='AI Fantasy GM',version='11.2');app.add_middleware(CORSMiddleware,allow_origins=['*'],allow_methods=['*'],allow_headers=['*'])"
          if marker not in s:
              raise SystemExit('LIVE_SHOW_OVR_SYSTEM_V1 marker not found')
          if app_line not in s:
              raise SystemExit('Expected FastAPI initialization line not found')
          s = s.replace(app_line + '\n', '', 1)
          s = s.replace(marker, app_line + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate Python
        run: python -m py_compile backend/main.py backend/run.py backend/show_server.py backend/show_live.py

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair needed'
            exit 0
          fi
          git config user.name 'AI Fantasy GM Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/main.py
          git commit -m 'Fix FastAPI app initialization before Live OVR routes'
          git push
