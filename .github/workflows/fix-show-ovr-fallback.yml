name: Fix Show OVR fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Fix false MLB The Show OVR fallback' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove false 70 fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/fixes.js')
          s = p.read_text(encoding='utf-8')
          old = "const backend=Number(p?.overall_value);if(Number.isFinite(backend))return Math.round(backend);return 70};"
          new = "return null};"
          if old not in s:
              raise SystemExit('Expected OVR fallback was not found; refusing to modify the file.')
          s = s.replace(old, new, 1)
          old2 = "const o=showOvr(p);return`<tr class=\"row\" title=\"Open player on ESPN\"><td><a href=\"${esc(url)}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none\" aria-label=\"Open ${name} on ESPN\"><div class=\"avatar ${ovrClass(o)}\" data-show-ovr=\"${o}\">${o}</div>"
          new2 = "const o=showOvr(p),od=Number.isFinite(o)?String(o):'—';return`<tr class=\"row\" title=\"Open player on ESPN\"><td><a href=\"${esc(url)}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none\" aria-label=\"Open ${name} on ESPN\"><div class=\"avatar ${Number.isFinite(o)?ovrClass(o):''}\" data-show-ovr=\"${Number.isFinite(o)?o:''}\">${od}</div>"
          if old2 not in s:
              raise SystemExit('Expected player renderer was not found; refusing to modify the file.')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/fixes.js
          git commit -m 'Fix false MLB The Show OVR fallback'
          git push
