name: Update MLB The Show Live Ratings

on:
  workflow_dispatch:
  push:
    paths:
      - 'show_live_ratings.py'
      - '.github/workflows/update-show-ratings.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python show_live_ratings.py
      - name: Commit updated ratings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/show_live_ratings.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update MLB The Show Live Series ratings'
          git push
