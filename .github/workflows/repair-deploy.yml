name: Repair deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair FastAPI initialization order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/main.py')
          s = p.read_text(encoding='utf-8')
          marker = '# LIVE_SHOW_OVR_SYSTEM_V1'
          app_line = "app=FastAPI(title='AI Fantasy GM',version='11.2');app.add_middleware(CORSMiddleware,allow_origins=['*'],allow_methods=['*'],allow_headers=['*'])"
          if marker not in s:
              raise SystemExit('Live OVR marker missing')
          if s.count(app_line) != 1:
              raise SystemExit(f'Expected one FastAPI initialization, found {s.count(app_line)}')
          before, after = s.split(marker, 1)
          before = before.replace(app_line + '\n', '')
          s = before + app_line + '\n' + marker + after
          p.write_text(s, encoding='utf-8')
          PY
      - name: Normalize show_server
        run: |
          cat > backend/show_server.py <<'PY'
          from . import main
          from .show_live import live_ratings_for_names
          from fastapi import Header, Query

          @main.app.get('/api/show/live-ratings')
          async def show_live_ratings(force: bool = Query(False), authorization: str = Header(None)):
              u = main.uid(authorization)
              league = main.league_row(u)
              req = main.req_for(league)
              data = await main.espn(req, ['mTeam', 'mRoster', 'mStatus'])
              names = []
              seen = set()
              for team in data.get('teams', []):
                  for entry in (team.get('roster') or {}).get('entries', []):
                      player = ((entry.get('playerPoolEntry') or {}).get('player') or {})
                      name = player.get('fullName')
                      if name:
                          key = main.re.sub(r'\s+', ' ', name.strip()).casefold()
                          if key not in seen:
                              seen.add(key)
                              names.append(name)
              return await live_ratings_for_names(names, force)

          @main.app.get('/api/show/live-ratings/health')
          async def show_live_ratings_health():
              return {'ok': True, 'source': 'theSHOWBASE Live Series', 'mode': 'league-player-only'}
          PY
      - name: Validate Python files
        run: python -m py_compile backend/main.py backend/show_server.py backend/show_live.py
      - name: Commit repair
        run: |
          git config user.name 'AI Fantasy GM Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/main.py backend/show_server.py .github/workflows/repair-deploy.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Live OVR deployment and validate backend'
          git push origin HEAD:main
