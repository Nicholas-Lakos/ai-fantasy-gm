name: Install live MLB The Show OVR system

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live OVR integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main = Path('backend/main.py')
          text = main.read_text()

          marker = '# LIVE_SHOW_OVR_SYSTEM_V1'
          if marker not in text:
              helper = r'''\n# LIVE_SHOW_OVR_SYSTEM_V1\nSHOWBASE_PLAYER_URL = 'https://www.theshowbase.com/26/player/{}-live'\n_SHOW_OVR_CACHE = {}\n_SHOW_OVR_TTL = 60 * 60\n\ndef _show_slug(name):\n    import unicodedata\n    s = unicodedata.normalize('NFKD', str(name or '')).encode('ascii', 'ignore').decode('ascii').lower()\n    s = re.sub(r'[^a-z0-9]+', '-', s).strip('-')\n    return s\n\nasync def _fetch_show_live_ovr(client, name):\n    import time\n    key = re.sub(r'\\s+', ' ', str(name or '').strip()).casefold()\n    now = time.time()\n    cached = _SHOW_OVR_CACHE.get(key)\n    if cached and now - cached['time'] < _SHOW_OVR_TTL:\n        return cached['overall']\n    slug = _show_slug(name)\n    if not slug:\n        return None\n    try:\n        r = await client.get(SHOWBASE_PLAYER_URL.format(slug), timeout=12, follow_redirects=True)\n        if r.status_code != 200:\n            return None\n        m = re.search(r'\\b([5-9]\\d|100)\\s+OVR\\b', r.text, re.I)\n        if not m:\n            return None\n        overall = int(m.group(1))\n        _SHOW_OVR_CACHE[key] = {'overall': overall, 'time': now}\n        return overall\n    except Exception:\n        return None\n\n@app.get('/api/show/live-ratings')\nasync def show_live_ratings(authorization: str = Header(None)):\n    u = uid(authorization)\n    l = league_row(u)\n    req = req_for(l)\n    data = await espn(req, ['mTeam', 'mRoster', 'mStatus'])\n    names = []\n    seen = set()\n    for team in data.get('teams', []):\n        for entry in (team.get('roster') or {}).get('entries', []):\n            p = entry.get('playerPoolEntry') or {}\n            player = p.get('player') or {}\n            name = player.get('fullName')\n            if name:\n                k = re.sub(r'\\s+', ' ', name.strip()).casefold()\n                if k not in seen:\n                    seen.add(k)\n                    names.append(name)\n    import asyncio as _asyncio\n    sem = _asyncio.Semaphore(10)\n    async with httpx.AsyncClient(headers={'User-Agent': 'AI-Fantasy-GM/1.0'}) as client:\n        async def one(name):\n            async with sem:\n                ovr = await _fetch_show_live_ovr(client, name)\n                return {'name': name, 'overall': ovr, 'source': 'theSHOWBASE Live Series'}\n        rows = await _asyncio.gather(*(one(name) for name in names))\n    return {'players': [x for x in rows if x['overall'] is not None], 'league_players': len(names), 'matched_players': sum(x['overall'] is not None for x in rows)}\n'''
              text = text.replace('app=FastAPI', helper + '\napp=FastAPI', 1)
              main.write_text(text)

          idx = Path('frontend/index.html')
          text = idx.read_text()
          # Remove the old hardcoded Top-100 rating table and replace it with live ratings fetched for the connected ESPN league.
          text = re.sub(r'const showOVR=\{.*?\};\nfunction normName\(n\)', "const showOVR={};\nfunction normName(n)", text, count=1, flags=re.S)
          text = re.sub(r"function showRating\(name\)\{return showOVR\[normName\(name\)\]\?\?null\}", "function showRating(name){return showOVR[normName(name)]??null}", text, count=1)
          old = "async function loadDash(){if(!tok)return;try{let j=await api('/dashboard');"
          new = "async function loadShowLiveRatings(){try{let j=await api('/api/show/live-ratings');let rows=j.players||[];for(let p of rows){let o=Number(p.overall);if(p.name&&Number.isFinite(o))showOVR[normName(p.name)]=Math.round(o)}window.SHOW_LIVE_RATINGS_READY=rows.length>0}catch(e){console.warn('Live Series OVR refresh failed',e)}}\nasync function loadDash(){if(!tok)return;try{await loadShowLiveRatings();let j=await api('/dashboard');"
          if old in text and 'LIVE_SHOW_OVR_FRONTEND_V1' not in text:
              text = text.replace(old, new, 1)
              text = text.replace('<script>\nlet tok=', '<script>\n/* LIVE_SHOW_OVR_FRONTEND_V1 */\nlet tok=', 1)
          idx.write_text(text)

          fx = Path('frontend/fixes.js')
          if fx.exists():
              text = fx.read_text()
              # Remove all repeated legacy Object.assign(showRatings, {...}) blocks.
              text = re.sub(r'Object\.assign\(showRatings,\{.*?\}\);\n', '', text, flags=re.S)
              fx.write_text(text)
          PY
      - name: Commit patched files
        run: |
          git config user.name "AI Fantasy GM Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/main.py frontend/index.html frontend/fixes.js
          git diff --cached --quiet && exit 0
          git commit -m "Use live MLB The Show OVRs for ESPN league players"
          git push
